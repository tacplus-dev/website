# The build image of tacplus-dev/website, by digest (#2, #3; looper#71, looper#84): tacplus build 2.6 at its latest
# patch, v2.6.12's digest (what `build:2.6` resolves to; the DSA-6628-1 rebuild, tacplus-dev/tacplus#711), in which this
# repository's gates (`just gates`, a strict MkDocs build: python3 and just, no Docker) run unchanged. The site has no CI
# image of its own (its GitHub workflow builds on ubuntu-latest), so it takes the fleet's. It is no tacplus project, so
# it has no tacplus.lock; the build pipeline reads this pin the way it reads one. A new digest is a change like any
# other, landed on the full gates: move it when the 2.6 line gets a new patch.
